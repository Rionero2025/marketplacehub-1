services:
  - type: web
    name: marketplace-hub
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    healthCheckPath: /_stcore/health
    disk:
      name: marketplace-hub-data
      mountPath: /app/data
      sizeGB: 20
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-hub-db
          property: connectionString
      - key: MARKETPLACE_HUB_DB_ENGINE
        value: postgresql
      - key: MARKETPLACE_HUB_MASTER_KEY
        sync: false
      - key: MARKETPLACE_HUB_REQUIRE_AUTH
        value: "true"
      - key: MARKETPLACE_HUB_ADMIN_USERNAME
        sync: false
      - key: MARKETPLACE_HUB_ADMIN_PASSWORD
        sync: false
      - key: MARKETPLACE_HUB_PG_POOL_MIN
        value: "2"
      - key: MARKETPLACE_HUB_PG_POOL_MAX
        value: "12"
      - key: TZ
        value: Europe/Rome


databases:
  - name: marketplace-hub-db
    region: frankfurt
    plan: 0.5c-1g
    databaseName: marketplace_hub
    user: marketplace_hub
    postgresMajorVersion: "17"
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []
